<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Web App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Hello World</h1>
    <p>A simple web app.</p>
    <div class="controls">
      <button id="btn">Click me</button>
      <button id="reset">Reset</button>
    </div>
    <p id="output"></p>
    <div class="message-form">
      <input id="msg-input" type="text" placeholder="Enter a custom message" />
      <button id="msg-btn">Show</button>
    </div>
    <div id="msg-output"></div>
  </div>
  <script src="app.js"></script>
</body>
</html>
