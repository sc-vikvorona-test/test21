  - { slug: secret,          klass: Secret,          plural: secrets,          fields: [id, name, ownerId, valueRef, rotatedAt, expiresAt, createdAt] }
  - { slug: credential,      klass: Credential,      plural: credentials,      fields: [id, name, ownerId, kind, expiresAt, createdAt] }
  - { slug: certificate,     klass: Certificate,     plural: certificates,     fields: [id, subject, issuer, notBeforeAt, notAfterAt, fingerprint, createdAt] }
  - { slug: sshKey,          klass: SshKey,          plural: sshKeys,          fields: [id, name, ownerId, fingerprint, lastUsedAt, expiresAt, createdAt] }
