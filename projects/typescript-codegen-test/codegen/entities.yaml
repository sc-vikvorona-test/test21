# Declarative entity schema for the typescript-codegen-test fixture.
# Each entry feeds codegen/generate.py which emits the matching files under
# src/generated/<slug>/ and tests/generated/<slug>.test.ts. The generator
# writes an AUTOGENERATED marker at the top of every output so reviewers
# (and the split-review fan-out filter) can tell hand-written sources from
# generated ones at a glance.
#
# Fields:
#   slug   — kebab/camel id, doubles as the directory name.
#   klass  — PascalCase entity name.
#   plural — URL segment for the controller and tests.
#   fields — list of property names; types are inferred by name suffix:
#              *Id / id / token / secret  →  string
#              *At                        →  Date | null
#              verified / active / *Enabled / isPrivate  → boolean
#              memberCount / amountCents / quantity / ...  → number
#              scopes / events / approverIds              → string[]
#              metadata                                   → Record<string, unknown>
#              everything else                            → string

entities:
  - { slug: user,            klass: User,            plural: users,            fields: [id, email, displayName, passwordHash, role, verified, createdAt] }
  - { slug: organization,    klass: Organization,    plural: organizations,    fields: [id, name, slug, plan, billingEmail, ownerId, createdAt] }
  - { slug: workspace,       klass: Workspace,       plural: workspaces,       fields: [id, name, organizationId, visibility, memberCount, createdAt] }
  - { slug: project,         klass: Project,         plural: projects,         fields: [id, name, workspaceId, language, status, archivedAt, createdAt] }
  - { slug: repository,      klass: Repository,      plural: repositories,     fields: [id, name, projectId, url, defaultBranch, isPrivate, createdAt] }
  - { slug: pullRequest,     klass: PullRequest,     plural: pullRequests,     fields: [id, number, repositoryId, title, state, authorId, mergedAt] }
  - { slug: issue,           klass: Issue,           plural: issues,           fields: [id, number, repositoryId, title, state, priority, assigneeId] }
  - { slug: comment,         klass: Comment,         plural: comments,         fields: [id, body, authorId, subjectId, subjectKind, editedAt, createdAt] }
  - { slug: review,          klass: Review,          plural: reviews,          fields: [id, pullRequestId, reviewerId, state, submittedAt, body] }
  - { slug: notification,    klass: Notification,    plural: notifications,    fields: [id, recipientId, kind, subjectId, readAt, createdAt] }
  - { slug: team,            klass: Team,            plural: teams,            fields: [id, name, organizationId, slug, parentTeamId, memberCount] }
  - { slug: membership,      klass: Membership,      plural: memberships,      fields: [id, userId, teamId, role, joinedAt] }
  - { slug: invitation,      klass: Invitation,      plural: invitations,      fields: [id, email, organizationId, inviterId, token, acceptedAt, expiresAt] }
  - { slug: apiKey,          klass: ApiKey,          plural: apiKeys,          fields: [id, name, ownerId, scopes, lastUsedAt, expiresAt, createdAt] }
  - { slug: webhook,         klass: Webhook,         plural: webhooks,         fields: [id, url, secret, events, ownerId, active, createdAt] }
  - { slug: deployment,      klass: Deployment,      plural: deployments,      fields: [id, projectId, environment, commitSha, status, deployedBy, createdAt] }
  - { slug: environment,     klass: Environment,     plural: environments,     fields: [id, name, projectId, protectionRule, approverIds, createdAt] }
  - { slug: auditLog,        klass: AuditLog,        plural: auditLogs,        fields: [id, actorId, action, resourceKind, resourceId, metadata, createdAt] }
  - { slug: billingAccount,  klass: BillingAccount,  plural: billingAccounts,  fields: [id, organizationId, plan, seats, currency, trialEndsAt, createdAt] }
  - { slug: invoice,         klass: Invoice,         plural: invoices,         fields: [id, billingAccountId, amountCents, currency, status, paidAt, dueAt] }
  - { slug: subscription,    klass: Subscription,    plural: subscriptions,    fields: [id, billingAccountId, plan, interval, renewsAt, canceledAt] }
  - { slug: usageRecord,     klass: UsageRecord,     plural: usageRecords,     fields: [id, billingAccountId, metric, quantity, recordedAt] }
  - { slug: session,         klass: Session,         plural: sessions,         fields: [id, userId, token, userAgent, ipAddress, expiresAt, createdAt] }
  - { slug: oauthGrant,      klass: OauthGrant,      plural: oauthGrants,      fields: [id, userId, clientId, scopes, expiresAt, revokedAt] }
  - { slug: featureFlag,     klass: FeatureFlag,     plural: featureFlags,     fields: [id, key, description, rolloutPercent, enabled, createdAt] }
  - { slug: task,            klass: Task,            plural: tasks,            fields: [id, title, projectId, assigneeId, status, priority, dueAt, createdAt] }
  - { slug: label,           klass: Label,           plural: labels,           fields: [id, name, color, repositoryId, description, createdAt] }
  - { slug: milestone,       klass: Milestone,       plural: milestones,       fields: [id, title, repositoryId, dueAt, state, description, createdAt] }
  - { slug: branch,          klass: Branch,          plural: branches,         fields: [id, name, repositoryId, commitSha, isProtected, createdAt] }
  - { slug: tag,             klass: Tag,             plural: tags,             fields: [id, name, repositoryId, commitSha, message, createdAt] }
  - { slug: release,         klass: Release,         plural: releases,         fields: [id, tag, repositoryId, name, body, publishedAt, createdAt] }
  - { slug: asset,           klass: Asset,           plural: assets,           fields: [id, releaseId, name, contentType, amountCents, downloadCount, createdAt] }
  - { slug: attachment,      klass: Attachment,      plural: attachments,      fields: [id, parentId, parentKind, name, contentType, sizeCents, uploadedAt] }
